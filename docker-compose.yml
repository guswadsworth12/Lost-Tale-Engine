# The app is usable with any model service configured in Settings. See DOCKER.md for first setup.
services:
  rp:
    build: .
    init: true
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3001}:3001"
    volumes:
      # Preserve the existing bind-mount location; back it up with the app stopped.
      - ${LT_DATA_DIR:-./data}:/app/data
    environment:
      TZ: ${TZ:-UTC}
      RP_ALLOWED_ORIGINS: ${RP_ALLOWED_ORIGINS:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  # Optional local text model. No host port: the app's authenticated relay reaches it at
  # http://ollama:11434/v1 after you add that address in Models and services.
  ollama:
    profiles: [local-model]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
