name: Wiki

on:
  pull_request:
    paths:
      - 'docs/wiki/**'
      - 'tools/wiki.mjs'
      - '.github/workflows/wiki.yml'
      - 'screenshots/**'
  push:
    branches: [master]
    paths:
      - 'docs/wiki/**'
      - 'tools/wiki.mjs'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node tools/wiki.mjs check

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node tools/wiki.mjs publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
